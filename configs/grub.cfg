set timeout=3
set default=0

menuentry "Alpine IPTV (Wyse 5070 / 3040)" {
    linux /boot/vmlinuz-wyse5070 root=PARTUUID=__ROOT_PARTUUID__ rootfstype=ext4 rw quiet console=tty0
}

menuentry "Alpine IPTV - 调试模式" {
    linux /boot/vmlinuz-wyse5070 root=PARTUUID=__ROOT_PARTUUID__ rootfstype=ext4 rw loglevel=7 console=tty0 console=ttyS0,115200
}
