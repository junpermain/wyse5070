set timeout=3
set default=0

# 串口输出：无头机器（Wyse 这类瘦客户机常没接显示器）和自动化冒烟都靠它看菜单，
# 主机的 COM1 不存在时 GRUB 只会报一句错，不影响正常引导。
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

# 本文件会被放到两个位置：
#   ESP:/EFI/BOOT/grub.cfg      —— grub-install --removable 时 GRUB 的 prefix 就指这里
#   root:/boot/grub/grub.cfg    —— 将来改成"装到硬盘"时用
# 既然可能从 ESP 上被加载，就不能用相对路径找内核，先按 ext4 的 UUID 把 root 分区找回来。
insmod part_gpt
insmod ext2
search --no-floppy --set=root --fs-uuid __ROOT_FSUUID__

menuentry "Alpine IPTV (Wyse 5070 / 3040)" {
    linux /boot/vmlinuz-wyse5070 root=PARTUUID=__ROOT_PARTUUID__ rootfstype=ext4 rw console=tty0 console=ttyS0,115200
}

menuentry "Alpine IPTV - 调试模式" {
    linux /boot/vmlinuz-wyse5070 root=PARTUUID=__ROOT_PARTUUID__ rootfstype=ext4 rw loglevel=7 console=tty0 console=ttyS0,115200
}
